<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宙園 - WORKS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
    <div class="layout-container">
        <aside class="sidebar">
            <div class="logo">
                <span class="hanja">宙園</span>
            </div>
            <nav>
                <ul class="menu">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="works.html" class="active-text">WORKS</a></li>
                    <li><a href="sns.html">SNS</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content works-content">
            <div class="works-container">
                <div class="filter-menu">
                    <a href="#" class="active-filter">ALL</a>
                    <a href="#">3D / 2D</a>
                    <a href="#">Media Art</a>
                    <a href="#">Video</a>
                </div>
                
                <div class="works-grid">
                    <!-- Column 1 -->
                    <div class="grid-col">
                        <div class="work-item">
                            <div class="work-box box-tall"></div>
                            <span class="work-label">MELT 0C</span>
                        </div>
                        <div class="work-item">
                            <span class="work-label" style="text-align: right;">MELT 0C</span>
                            <div class="work-box box-square"></div>
                        </div>
                        <div class="work-item">
                            <div class="work-box box-wide"></div>
                        </div>
                    </div>
                    
                    <!-- Column 2 -->
                    <div class="grid-col">
                        <div class="work-item">
                            <div class="work-box box-wide"></div>
                            <span class="work-label">MELT 0C</span>
                        </div>
                        <div class="work-item">
                            <div class="work-box box-tall-2"></div>
                            <span class="work-label">MELT 0C</span>
                        </div>
                        <div class="work-item">
                            <div class="work-box box-wide"></div>
                        </div>
                    </div>
                    
                    <!-- Column 3 -->
                    <div class="grid-col">
                        <div class="work-item">
                            <span class="work-label">MELT 0C</span>
                            <div class="work-box box-tall-3"></div>
                        </div>
                        <div class="work-item">
                            <div class="work-box box-wide"></div>
                            <span class="work-label">MELT 0C</span>
                        </div>
                        <div class="work-item">
                            <div class="work-box box-wide"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div class="scroll-indicator" onclick="document.querySelector('.works-content').scrollTo({top: 0, behavior: 'smooth'});"></div>
    
    <script src="transition.js"></script>
    <script src="cursor.js"></script>
</body>
</html>
